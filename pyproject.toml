[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-goal-prediction"
version = "0.1.0"
description = "Temporal NHL paired-goal forecasting and archival thesis revision"
requires-python = ">=3.12,<3.13"
authors = [{name = "Howard R. Silvey"}]
dependencies = ["numpy==2.3.5", "pandas==2.3.3", "scipy==1.18.1", "scikit-learn==1.9.1", "matplotlib==3.11.2"]

[project.optional-dependencies]
documents = ["python-docx==1.2.0", "reportlab==4.4.5", "pymupdf==1.28.2", "pypdf==6.4.1"]

[tool.setuptools.packages.find]
where = ["src"]
